[project]
name = "dataguard"
version = "0.1.0"
description = "DataGuard — Risk-Aware Autonomous Data Quality Operations"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    
    # Data processing
    "polars>=1.6.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "openpyxl>=3.1.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "sqlmodel>=0.0.21",
    
    # Validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    
    # AI/ML
    "openai>=1.40.0",
    "litellm>=1.44.0",
    "tiktoken>=0.7.0",
    
    # Statistics & ML
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    
    # Text processing
    "rapidfuzz>=3.9.0",
    "chardet>=5.2.0",
    
    # Schema validation
    "jsonschema>=4.23.0",
    
    # Caching
    "redis>=5.0.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
